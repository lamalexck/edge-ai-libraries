name: Detection Only Smart NVR
definition: >
  This pipeline processes video streams with AI-based analytics including object detection, tracking,
  and classification. Outputs include video recording, metadata, and processed video frames.
tags:
  - Smart Cities
thumbnail: images/smart-nvr.png
variants:
  - name: GPU_yolo11n
    pipeline_description: >-
      filesrc location=/videos/input/bigbuckbunny.h265.1080p.2mbps.mp4 !
      parsebin !
      tee name=t0 !
      queue !
      splitmuxsink location=/tmp/bigbuckbunny-output.mp4
      t0. !
      queue !
      vah265dec !
      video/x-raw(memory:VAMemory) !
      gvafpscounter starting-frame=500 !
      gvadetect
        model=/models/output/public/yolo11n/INT8/yolo11n.xml
        model-instance-id=detect0
        pre-process-backend=va-surface-sharing
        device=GPU
        ie-config=GPU_THROUGHPUT_STREAMS=2
        batch-size=0
        inference-interval=3
        inference-region=full-frame
        nireq=0 !
      queue !
      gvawatermark !
      gvametaconvert format=json !
      gvametapublish method=file file-path=/dev/null !
      fakesink name=default_output_sink async=false
