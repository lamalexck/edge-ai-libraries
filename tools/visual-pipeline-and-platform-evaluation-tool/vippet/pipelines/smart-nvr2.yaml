name: Smart NVR2
definition: >
  This pipeline processes video streams with object detection AI analytics. Outputs include video recording, metadata, and processed video frames.
tags:
  - Smart Cities
thumbnail: images/smart-nvr.png
variants:
  - name: CPU
    pipeline_description: >-
      filesrc location=/videos/input/auto/toronto-canada-ontario-downton-14365425.mp4 !
        qtdemux name=demux
        demux.audio_0 !
          queue name=audio_queue !
          smux.audio_0
        demux.video_0 !
          queue name=video_queue !
          h264parse config-interval=-1 !
          tee name=video_tee !
              queue name=video_queue_1 !
              splitmuxsink name=smux location=/tmp/toronto-canada-ontario-downton-14365425-output.mp4
            video_tee. !
              queue name=video_queue_2 !
              avdec_h264 !
              video/x-raw !
              gvafpscounter starting-frame=100 !
              gvadetect model=/models/output/ultralytics/public/yolo11n/INT8/yolo11n.xml
                model-instance-id=detect0
                pre-process-backend=opencv
                device=CPU
                batch-size=0
                inference-interval=3
                nireq=0 !
              queue name=gvadetect_queue !
              gvawatermark !
              gvametaconvert format=json !
              gvametapublish method=file file-path=/dev/null !
              fakesink name=default_output_sink
  - name: GPU
    pipeline_description: >-
      filesrc location=/videos/input/auto/toronto-canada-ontario-downton-14365425.mp4 !
        qtdemux name=demux
        demux.audio_0 !
          queue name=audio_queue !
          smux.audio_0
        demux.video_0 !
          queue name=video_queue !
          h264parse config-interval=-1 !
          tee name=video_tee !
              queue name=video_queue_1 !
              splitmuxsink name=smux location=/tmp/toronto-canada-ontario-downton-14365425-output.mp4
            video_tee. !
              queue name=video_queue_2 !
              vah264dec !
              video/x-raw(memory:VAMemory) !
              gvafpscounter starting-frame=100 !
              gvadetect model=/models/output/ultralytics/public/yolo11n/INT8/yolo11n.xml
                model-instance-id=detect0
                pre-process-backend=va-surface-sharing
                device=GPU
                ie-config=GPU_THROUGHPUT_STREAMS=2
                batch-size=0
                inference-interval=3
                nireq=0 !
              queue name=gvadetect_queue !
              gvawatermark !
              gvametaconvert format=json !
              gvametapublish method=file file-path=/dev/null !
              fakesink name=default_output_sink
  - name: NPU
    pipeline_description: >-
      filesrc location=/videos/input/auto/toronto-canada-ontario-downton-14365425.mp4 !
        qtdemux name=demux
        demux.audio_0 !
          queue name=audio_queue !
          smux.audio_0
        demux.video_0 !
          queue name=video_queue !
          h264parse config-interval=-1 !
          tee name=video_tee !
              queue name=video_queue_1 !
              splitmuxsink name=smux location=/tmp/toronto-canada-ontario-downton-14365425-output.mp4
            video_tee. !
              queue name=video_queue_2 !
              vah264dec !
              video/x-raw(memory:VAMemory) !
              gvafpscounter starting-frame=100 !
              gvadetect model=/models/output/ultralytics/public/yolo11n/INT8/yolo11n.xml
                model-instance-id=detect0
                pre-process-backend=va
                device=NPU
                batch-size=1
                inference-interval=3
                nireq=2 !
              queue name=gvadetect_queue !
              gvawatermark !
              gvametaconvert format=json !
              gvametapublish method=file file-path=/dev/null !
              fakesink name=default_output_sink